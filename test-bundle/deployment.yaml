apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx
        env:
          - name: HELLO
            valueFrom:
              configMapKeyRef:
                name: fleet-test-config
                key: message
        ports:
        - containerPort: 80
